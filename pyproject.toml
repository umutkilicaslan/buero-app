[project]
name = "buero"
version = "0.1.0"
description = "Local bookkeeping and invoicing for freelancers in Germany"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "weasyprint>=61",
    "factur-x>=3.1",
    "httpx>=0.27",
]

[project.scripts]
buero = "buero.__main__:main"
buero-backup = "buero.backup:main"
buero-app = "buero.desktop:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Building the Mac app (packaging/macos): uv sync --group desktop
desktop = ["pyinstaller>=6.10", "rumps>=0.4; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
